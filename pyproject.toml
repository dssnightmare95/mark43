[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "action-capture"
version = "0.1.0"
description = "Modular computer-use dataset recorder for Windows"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pynput>=1.7",
    "pywin32>=306",
    "uiautomation>=2.0",
    "psutil>=5.9",
]

[project.scripts]
# Lets you install the package and run `action-capture` as a command.
action-capture = "action_capture.recorder:main"

[tool.setuptools.packages.find]
include = ["action_capture*"]
